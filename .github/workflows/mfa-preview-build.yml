name: Build isolated MFA test preview
on:
  push:
    branches: [feature/google-authenticator-mfa]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: sponti-mfa-test-preview
          path: dist
          retention-days: 7
